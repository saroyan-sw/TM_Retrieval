[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmbench"
version = "0.1.0"
description = "Benchmark transmission-matrix retrieval from public optical measurements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
dev = ["pytest>=7"]
convex = ["cvxpy>=1.6", "scs>=3.2.4.post1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
